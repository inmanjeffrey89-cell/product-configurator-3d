<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>3D Product Configurator</title>
  <meta name="description" content="Configure a mug, chair or backpack in the browser: colors, finish, monogram, live price and a shareable link.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23b4532a'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23f4f0e8'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <header class="topbar">
    <a class="wordmark" href="./">Configurator</a>
    <a class="topbar-link" href="https://github.com/inmanjeffrey89-cell/product-configurator-3d">Source on GitHub</a>
  </header>

  <main class="app">
    <section class="stage" aria-label="3D preview">
      <canvas id="view" aria-label="3D view of the product. Drag to rotate, scroll to zoom."></canvas>
      <p class="stage-loading" aria-hidden="true">Loading 3D view</p>
      <p class="stage-failed">This browser could not start WebGL, so the 3D view is unavailable.</p>
      <p class="stage-hint">Drag to rotate, scroll to zoom</p>
      <div class="stage-actions">
        <button type="button" id="reset-view" class="btn btn-small">Reset view</button>
      </div>
    </section>

    <aside class="panel" id="panel" aria-labelledby="product-name">
      <button type="button" class="sheet-toggle" aria-expanded="false" aria-controls="panel-body">
        <span class="sheet-grip" aria-hidden="true"></span>
        <span class="sheet-summary">
          <span id="sheet-title">Product</span>
          <span id="sheet-price"></span>
        </span>
        <span class="sheet-cue">Customize</span>
      </button>
      <div class="panel-body" id="panel-body"></div>
    </aside>
  </main>

  <script type="module" src="src/main.js"></script>
</body>
</html>
